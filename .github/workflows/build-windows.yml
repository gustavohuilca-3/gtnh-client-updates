name: Build GTNH Client Updater for Windows
on:
  workflow_dispatch:
  push:
    tags: ["client-v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r client/requirements-build.txt
      - name: Test Windows client
        run: python -m unittest discover -s tests -p "test_client_*.py" -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GTNHClientUpdater --paths client client/main.py
      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-package | Out-Null
          Copy-Item dist/GTNHClientUpdater.exe dist-package/
          Copy-Item WINDOWS_INSTALL.md dist-package/
          Compress-Archive -Path dist-package/* -DestinationPath GTNHClientUpdater-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GTNHClientUpdater-Windows
          path: GTNHClientUpdater-Windows.zip
          if-no-files-found: error
